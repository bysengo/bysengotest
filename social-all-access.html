<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <title>All Access - Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Arimo:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1B3533 0%, #67441A 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(213, 112, 40, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(113, 126, 54, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px;
            position: relative;
            z-index: 1;
        }

        .badge {
            background: linear-gradient(135deg, #D57028, #AF8145);
            color: #FFFFFF;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(213, 112, 40, 0.4);
        }

        h1 {
            font-family: 'Arimo', sans-serif;
            font-size: 90px;
            font-weight: 800;
            color: #F3EDE7;
            line-height: 1.1;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 32px;
            color: #F3EDE7;
            font-weight: 400;
            margin-bottom: 50px;
            opacity: 0.95;
            max-width: 800px;
            line-height: 1.4;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
            max-width: 800px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            border: 2px solid rgba(243, 237, 231, 0.2);
            color: #F3EDE7;
            font-size: 20px;
            font-weight: 600;
        }

        .price-section {
            margin-bottom: 40px;
        }

        .price {
            font-size: 72px;
            font-weight: 900;
            color: #D57028;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
        }

        .price-period {
            font-size: 28px;
            color: #F3EDE7;
            font-weight: 600;
        }

        .cta {
            background: #D57028;
            color: #FFFFFF;
            padding: 24px 60px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(213, 112, 40, 0.5);
            margin-bottom: 30px;
        }

        .logo {
            position: absolute;
            bottom: 50px;
            font-size: 24px;
            color: #F3EDE7;
            font-weight: 700;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">ALL ACCESS MEMBERSHIP</div>
        <h1>Everything.<br>One Price.</h1>
        <p class="tagline">Access both founder and investor resources</p>

        <div class="features">
            <div class="feature">🚀 Founder Tools</div>
            <div class="feature">💼 Investor Dealflow</div>
            <div class="feature">🎓 Full Education</div>
            <div class="feature">🤝 Both Communities</div>
        </div>

        <div class="price-section">
            <div class="price">$260/year</div>
            <div class="price-period">or $25/month</div>
        </div>

        <a href="#" class="cta">Join Now</a>

        <div class="logo">SENGO</div>
    </div>
</body>
</html>
