<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sengo | Pre-Seed Investment Deck</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F3EDE7;
      color: #1B3533;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #email-gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    #email-gate::before {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 70%; height: 70%;
      background: radial-gradient(circle, rgba(213,112,40,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    #email-gate::after {
      content: '';
      position: absolute;
      bottom: -20%; left: -15%;
      width: 60%; height: 60%;
      background: radial-gradient(circle, rgba(27,53,51,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .gate-logo { width: 80px; height: auto; margin-bottom: 40px; color: #1B3533; position: relative; z-index: 1; }
    .gate-card {
      background: #fff;
      border-radius: 20px;
      padding: 60px 50px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 80px rgba(27,53,51,0.12);
      position: relative;
      z-index: 1;
    }
    .gate-badge {
      display: inline-block;
      background: rgba(213,112,40,0.1);
      color: #D57028;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .gate-card h1 {
      font-family: 'Arimo', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #1B3533;
      margin-bottom: 16px;
    }
    .gate-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #67441A;
      margin-bottom: 36px;
      font-weight: 400;
    }
    .kajabi-form-container { width: 100%; min-height: 80px; }
    .kajabi-form-container form { font-family: 'Montserrat', sans-serif !important; }
    .kajabi-form-container input[type="email"],
    .kajabi-form-container input[type="text"] {
      border: 2px solid rgba(27,53,51,0.15) !important;
      border-radius: 12px !important;
      padding: 14px 18px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 1rem !important;
      background: #F3EDE7 !important;
      color: #1B3533 !important;
      transition: border-color 0.3s ease !important;
    }
    .kajabi-form-container input:focus { border-color: #D57028 !important; outline: none !important; }
    .kajabi-form-container button[type="submit"],
    .kajabi-form-container input[type="submit"] {
      width: 100% !important;
      padding: 16px 20px !important;
      background: linear-gradient(135deg, #D57028 0%, #AF8145 100%) !important;
      color: #F3EDE7 !important;
      border: none !important;
      border-radius: 12px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
      cursor: pointer !important;
      transition: transform 0.3s ease, box-shadow 0.3s ease !important;
    }
    .kajabi-form-container button[type="submit"]:hover,
    .kajabi-form-container input[type="submit"]:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 30px rgba(213,112,40,0.3) !important;
    }
    .gate-footer { margin-top: 24px; font-size: 0.8rem; color: #AF8145; opacity: 0.7; }
    .gate-footer a { color: #D57028; text-decoration: none; }

    @media (max-width: 640px) {
      .gate-card { padding: 40px 28px; }
      .gate-card h1 { font-size: 2rem; }
      .gate-card p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div id="email-gate">
    <img class="gate-logo" src="https://images.squarespace-cdn.com/content/v1/64bef9c843c01a1201d98873/f28e57cc-eb1f-4898-a4fd-476adda1265a/4.png?format=1000w" alt="Sengo">
    <div class="gate-card">
      <span class="gate-badge">Investor Preview</span>
      <h1>Pre-Seed<br>Pitch Deck</h1>
      <p>Enter your email to access the Sengo pre-seed investment presentation.</p>
      <div class="kajabi-form-container">
        <script src="https://app.bysengo.com/forms/2149477022/embed.js"></script>
      </div>
      <p class="gate-footer">
        By entering your email you agree to our
        <a href="#">Privacy Policy</a>.
      </p>
    </div>
  </div>

</body>
</html>
