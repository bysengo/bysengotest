<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sengo | Pre-Seed Investment Deck</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F3EDE7;
      color: #1B3533;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #email-gate {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }
    #email-gate::before {
      content: '';
      position: absolute;
      top: -30%; right: -20%;
      width: 70%; height: 70%;
      background: radial-gradient(circle, rgba(213,112,40,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    #email-gate::after {
      content: '';
      position: absolute;
      bottom: -20%; left: -15%;
      width: 60%; height: 60%;
      background: radial-gradient(circle, rgba(27,53,51,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .gate-logo { width: 80px; height: auto; margin-bottom: 40px; color: #1B3533; position: relative; z-index: 1; }
    .gate-card {
      background: #fff;
      border-radius: 20px;
      padding: 60px 50px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 80px rgba(27,53,51,0.12);
      position: relative;
      z-index: 1;
    }
    .gate-badge {
      display: inline-block;
      background: rgba(213,112,40,0.1);
      color: #D57028;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .gate-card h1 {
      font-family: 'Arimo', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #1B3533;
      margin-bottom: 16px;
    }
    .gate-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #67441A;
      margin-bottom: 36px;
      font-weight: 400;
    }
    .kajabi-form-container { width: 100%; min-height: 80px; }
    .kajabi-form-container form { font-family: 'Montserrat', sans-serif !important; }
    .kajabi-form-container input[type="email"],
    .kajabi-form-container input[type="text"] {
      border: 2px solid rgba(27,53,51,0.15) !important;
      border-radius: 12px !important;
      padding: 14px 18px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 1rem !important;
      background: #F3EDE7 !important;
      color: #1B3533 !important;
      transition: border-color 0.3s ease !important;
    }
    .kajabi-form-container input:focus { border-color: #D57028 !important; outline: none !important; }
    .kajabi-form-container button[type="submit"],
    .kajabi-form-container input[type="submit"] {
      width: 100% !important;
      padding: 16px 20px !important;
      background: linear-gradient(135deg, #D57028 0%, #AF8145 100%) !important;
      color: #F3EDE7 !important;
      border: none !important;
      border-radius: 12px !important;
      font-family: 'Montserrat', sans-serif !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
      cursor: pointer !important;
      transition: transform 0.3s ease, box-shadow 0.3s ease !important;
    }
    .kajabi-form-container button[type="submit"]:hover,
    .kajabi-form-container input[type="submit"]:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 30px rgba(213,112,40,0.3) !important;
    }
    .gate-footer { margin-top: 24px; font-size: 0.8rem; color: #AF8145; opacity: 0.7; }
    .gate-footer a { color: #D57028; text-decoration: none; }

    @media (max-width: 640px) {
      .gate-card { padding: 40px 28px; }
      .gate-card h1 { font-size: 2rem; }
      .gate-card p { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div id="email-gate">
    <svg class="gate-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
      <path d="M380 170 Q480 180 680 230 Q660 240 680 250 L680 800 Q420 700 150 550 Q140 540 150 520 Z" fill="currentColor"/>
      <path d="M620 480 Q640 460 720 480 Q780 490 840 520 Q900 550 940 580 Q980 600 1040 640 Q1100 680 1140 720 Q1160 740 1180 770 Q1200 800 1220 830" stroke="currentColor" stroke-width="25" fill="none" stroke-linecap="round"/>
      <path d="M720 500 Q760 480 800 480 Q820 480 840 490 Q860 500 880 520 Q900 540 900 560 Q900 580 880 600 Q860 620 840 630 Q820 640 800 640 Q780 640 760 630" stroke="currentColor" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M880 520 Q920 500 960 500 Q1000 500 1040 520 Q1080 540 1100 560" stroke="currentColor" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M1020 540 Q1040 520 1080 520 Q1120 520 1160 540 Q1200 560 1240 600 Q1260 620 1280 650" stroke="currentColor" stroke-width="20" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="gate-card">
      <span class="gate-badge">Investor Preview</span>
      <h1>Pre-Seed<br>Pitch Deck</h1>
      <p>Enter your email to access the Sengo pre-seed investment presentation.</p>
      <div class="kajabi-form-container">
        <script src="https://app.bysengo.com/forms/2149477022/embed.js"></script>
      </div>
      <p class="gate-footer">
        By entering your email you agree to our
        <a href="#">Privacy Policy</a>.
      </p>
    </div>
  </div>

</body>
</html>
