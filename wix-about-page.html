<!-- Sleeker version of your About page (based on your current structure) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me</title>

  <!-- Fonts (same as your file, just used more "sleekly") -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600&family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-main:#f7f7f6;
      --bg-accent:#efece8;
      --surface:#ffffff;

      --text-primary:#111111;
      --text-secondary:#5f6368;

      --accent:#c97a63;
      --accent-soft:#e8d6cf;

      --border:#e2e2e0;
      --shadow: 0 14px 40px rgba(0,0,0,0.08);
      --shadow-soft: 0 10px 30px rgba(0,0,0,0.06);

      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-pill: 999px;

      --container: 1120px;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container{
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 28px;
    }

    /* HERO */
    .hero{
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 96px 24px;
      position:relative;
      overflow:hidden;
      background: radial-gradient(1200px 600px at 50% 30%, var(--bg-accent) 0%, var(--bg-main) 60%);
    }

    /* Soft, subtle background shape with image */
    .hero::before{
      content:"";
      position:absolute;
      inset:auto;
      width: 900px;
      height: 520px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      background-image:
        linear-gradient(135deg, rgba(247,247,246,0.7), rgba(247,247,246,0.5)),
        url('https://media.licdn.com/dms/image/v2/D5622AQGYRJ7vrtFqmg/feedshare-shrink_1280/B56ZtcsyE6G0As-/0/1766786842038?e=1769644800&v=beta&t=ojYDSEH9AGOy_qljVr6a6ZhyOcX6iVqgR4SangDah_o');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(1px);
      border-radius: 48px;
      opacity: 0.6;
      z-index:0;
    }

    .hero-content{
      max-width: 980px;
      position:relative;
      z-index:1;
      animation: fadeInUp 0.7s ease-out;
    }

    .hero h1{
      font-family: "Arimo", sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 0.92;
      margin-bottom: 22px;

      /* Sleek outline: thinner stroke, less "poster" */
      font-size: clamp(3.2rem, 9vw, 7rem);
      color: transparent;
      -webkit-text-stroke: 1.5px var(--accent);
      text-stroke: 1.5px var(--accent);
    }

    .subtitle{
      margin: 0 auto;
      max-width: 720px;
      color: var(--text-secondary);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.7;
    }

    .hero .social-links{
      margin-top: 34px;
      display:flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content:center;
      align-items:center;
    }

    .hero .social-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 10px;

      padding: 12px 18px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);

      text-decoration:none;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.02em;

      box-shadow: none;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      backdrop-filter: blur(10px);
    }

    .hero .social-link:hover{
      transform: translateY(-2px);
      background: rgba(239,236,232,0.9);
      border-color: rgba(201,122,99,0.25);
    }

    .hero .social-link svg{
      width: 18px;
      height: 18px;
      opacity: 0.9;
    }

    /* SECTION TITLES */
    .section-title{
      font-family: "Playfair Display", serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align:center;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin-bottom: 34px;
      color: var(--text-primary);
    }

    /* PHOTO SECTION */
    .photo-section{
      padding: 92px 0;
      background: var(--bg-main);
    }

    .photo-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      margin-top: 24px;
    }

    .photo-placeholder{
      aspect-ratio: 3/4;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfa 100%);
      box-shadow: var(--shadow-soft);

      display:flex;
      align-items:center;
      justify-content:center;

      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* CONNECT SECTION */
    .connect-section{
      padding: 92px 0 110px;
      background: #0f0f10; /* sleek dark */
      color: #ffffff;
      position: relative;
      overflow:hidden;
    }

    /* subtle top curve */
    .connect-section::before{
      content:"";
      position:absolute;
      top:-60px;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 120px;
      background: var(--bg-main);
      border-radius: 0 0 60% 60%;
      opacity: 1;
    }

    .connect-section .section-title{
      color: #ffffff;
      margin-bottom: 28px;
      position:relative;
      z-index:1;
    }

    .social-links{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      max-width: 980px;
      margin: 0 auto 38px;
      position:relative;
      z-index:1;
    }

    .social-link{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 18px;
      border-radius: var(--radius-lg);
      text-decoration:none;

      color: #ffffff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .social-link:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,0.10);
      border-color: rgba(201,122,99,0.35);
    }

    /* FORM */
    .contact-form{
      max-width: 640px;
      margin: 0 auto;
      padding: 34px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius-xl) + 4px);
      box-shadow: var(--shadow);
      position:relative;
      z-index:1;
    }

    .form-group{ margin-bottom: 16px; }

    label{
      display:block;
      margin-bottom: 8px;
      color: #2b2f33;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.01em;
    }

    input, textarea{
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #d9d9d6;
      background: #ffffff;
      color: var(--text-primary);
      font: inherit;
      font-size: 1rem;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input::placeholder, textarea::placeholder{
      color: rgba(17,17,17,0.35);
    }

    input:focus, textarea:focus{
      outline:none;
      border-color: rgba(201,122,99,0.55);
      box-shadow: 0 0 0 4px rgba(201,122,99,0.18);
    }

    textarea{
      resize: vertical;
      min-height: 150px;
    }

    .submit-btn{
      width: 100%;
      margin-top: 6px;
      padding: 14px 18px;
      border: none;
      border-radius: var(--radius-pill);
      cursor:pointer;

      background: var(--accent);
      color: #ffffff;

      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform .2s ease, filter .2s ease;
    }

    .submit-btn:hover{
      transform: translateY(-1px);
      filter: brightness(0.95);
    }

    /* FOOTER */
    .footer{
      padding: 40px 24px;
      background: #0f0f10;
      color: rgba(255,255,255,0.65);
      text-align:center;
    }
    .footer p{
      font-size: 0.85rem;
      font-weight: 400;
    }

    /* Responsive */
    @media (max-width: 768px){
      .hero{
        padding: 72px 18px;
      }
      .hero::before{
        width: 110%;
        height: 420px;
        border-radius: 36px;
      }
      .contact-form{
        padding: 22px;
      }
      .hero .social-link{
        width: 100%;
        max-width: 320px;
      }
    }

    @keyframes fadeInUp{
      from{ opacity:0; transform: translateY(18px); }
      to{ opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Ila B Corcoran</h1>
      <p class="subtitle">
        Educator, founder, and investor at the intersection of capital, culture, and community.
      </p>

      <div class="social-links">
        <a href="YOUR_SUBSTACK_URL" class="social-link" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

          </svg>
          <span>LinkedIn</span>
        </a>
      </div>
    </div>
  </section>

  <!-- PHOTOS -->
  <section class="photo-section">
    <div class="container">
      <h2 class="section-title">Moments</h2>
      <div class="photo-grid">
        <div class="photo-placeholder">[Insert Photo 1]</div>
        <div class="photo-placeholder">[Insert Photo 2]</div>
        <div class="photo-placeholder">[Insert Photo 3]</div>
      </div>
    </div>
  </section>

  <!-- CONNECT -->
  <section class="connect-section">
    <div class="container">
      <h2 class="section-title">Get In Touch</h2>

      <div class="social-links">
        <a href="YOUR_SUBSTACK_URL" class="social-link" target="_blank" rel="noreferrer">Substack</a>
        <a href="YOUR_LINKEDIN_URL" class="social-link" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="YOUR_THREADS_URL" class="social-link" target="_blank" rel="noreferrer">Threads</a>

      <div class="contact-form">
        <form action="#" method="POST">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="your@email.com" required />

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="What would you like to discuss?" required></textarea>

        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 All rights reserved.</p>
  </footer>

</html>
