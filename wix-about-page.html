<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #faf8f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 60px;
            background: #faf8f5;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Main Headlines - Creative Outlined Typography */
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 15vw, 14rem);
            font-weight: 800;
            letter-spacing: -4px;
            line-height: 0.85;
            margin-bottom: 60px;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 3px #d4886f;
            text-stroke: 3px #d4886f;
            paint-order: stroke fill;
            position: relative;
        }

        /* Organic shape behind name */
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 70%;
            background: #f0e8dc;
            border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
            z-index: 1;
            opacity: 0.5;
        }

        /* Badge style subtitle */
        .hero-content .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: #6b4e3d;
            background: #e8dcc8;
            max-width: 500px;
            margin: 0 auto 60px;
            padding: 20px 40px;
            line-height: 1.6;
            letter-spacing: 0.5px;
            border-radius: 50px;
            border: 2px solid #d4886f;
            position: relative;
            font-style: italic;
        }

        /* Social links in hero */
        .hero .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            background: #fff;
            border: 2px solid #d4886f;
            border-radius: 30px;
            text-decoration: none;
            color: #6b4e3d;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px #d4886f;
            position: relative;
        }

        .hero .social-link:hover {
            background: #d4886f;
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #6b4e3d;
        }

        .hero .social-link span {
            margin-left: 10px;
        }

        .hero .social-link svg {
            width: 18px;
            height: 18px;
        }

        /* Section Labels - Playful style */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 60px;
            text-align: center;
            color: #d4886f;
            font-style: italic;
        }

        /* Photo Gallery */
        .photo-section {
            padding: 120px 40px;
            background: #faf8f5;
            position: relative;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 60px;
        }

        .photo-placeholder {
            aspect-ratio: 3/4;
            background: #e8dcc8;
            border: 3px solid #d4886f;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: #6b4e3d;
            transition: transform 0.3s ease, border-radius 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 8px 8px 0px #d4886f;
        }

        .photo-placeholder:hover {
            transform: rotate(-2deg) scale(1.02);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
        }

        .photo-placeholder:nth-child(2) {
            border-radius: 50% 50% 50% 50% / 40% 60% 60% 40%;
        }

        .photo-placeholder:nth-child(3) {
            border-radius: 50% 50% 50% 50% / 55% 45% 55% 45%;
        }

        /* Connect Section */
        .connect-section {
            padding: 120px 40px;
            background: #6b4e3d;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .connect-section::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 100px;
            background: #faf8f5;
            border-radius: 0 0 50% 50%;
        }

        .connect-section .section-title {
            color: #faf8f5;
            margin-bottom: 60px;
            position: relative;
            z-index: 2;
        }

        .social-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto 80px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-link:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
            transform: translateY(-4px);
        }

        .social-link span {
            margin-left: 12px;
        }

        /* Contact Form */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 50px;
            background: #faf8f5;
            border-radius: 40px;
            border: 3px solid #d4886f;
            box-shadow: 12px 12px 0px rgba(212, 136, 111, 0.3);
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            color: #6b4e3d;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #d4886f;
            border-radius: 20px;
            background: #fff;
            color: #6b4e3d;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(107, 78, 61, 0.4);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #6b4e3d;
            box-shadow: 4px 4px 0px #d4886f;
            transform: translate(-2px, -2px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px 40px;
            background: #d4886f;
            color: #fff;
            border: 2px solid #6b4e3d;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 6px 6px 0px #6b4e3d;
        }

        .submit-btn:hover {
            background: #6b4e3d;
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px #6b4e3d;
        }

        /* Footer */
        .footer {
            padding: 60px 40px;
            background: #6b4e3d;
            text-align: center;
            color: rgba(250, 248, 245, 0.7);
        }

        .footer p {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                min-height: 100vh;
                padding: 60px 30px;
            }

            .hero-content h1 {
                font-size: clamp(3.5rem, 12vw, 6rem);
                -webkit-text-stroke: 2px #d4886f;
                letter-spacing: -2px;
            }

            .hero::before {
                width: 90%;
                height: 60%;
            }

            .section-title {
                font-size: 2rem;
            }

            .photo-section,
            .connect-section {
                padding: 80px 20px;
            }

            .photo-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .photo-placeholder {
                box-shadow: 6px 6px 0px #d4886f;
            }

            .social-links {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .hero .social-links {
                flex-direction: column;
                width: 100%;
            }

            .hero .social-link {
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }

            .contact-form {
                padding: 30px 25px;
                box-shadow: 8px 8px 0px rgba(212, 136, 111, 0.3);
            }

            .connect-section::before {
                height: 80px;
            }
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Custom animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
