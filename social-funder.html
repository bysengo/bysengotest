<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <title>Funder Membership - Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Arimo:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1B3533;
            position: relative;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(135deg, #67441A 0%, #AF8145 100%);
            clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%);
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px;
            position: relative;
            z-index: 1;
        }

        .badge {
            background: linear-gradient(135deg, #D57028, #AF8145);
            color: #FFFFFF;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            box-shadow: 0 8px 25px rgba(213, 112, 40, 0.4);
        }

        h1 {
            font-family: 'Arimo', sans-serif;
            font-size: 100px;
            font-weight: 800;
            color: #F3EDE7;
            line-height: 1;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 34px;
            color: #F3EDE7;
            font-weight: 600;
            margin-bottom: 70px;
            max-width: 700px;
            line-height: 1.3;
        }

        .benefits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 800px;
        }

        .benefit-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid rgba(243, 237, 231, 0.3);
            color: #F3EDE7;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .benefit-icon {
            font-size: 36px;
            flex-shrink: 0;
        }

        .price-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 70px;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .price {
            font-size: 72px;
            font-weight: 900;
            color: #D57028;
            margin-bottom: 8px;
            line-height: 1;
        }

        .price-period {
            font-size: 28px;
            color: #1B3533;
            font-weight: 600;
        }

        .subtext {
            font-size: 20px;
            color: #F3EDE7;
            font-weight: 500;
            opacity: 0.9;
        }

        .logo {
            position: absolute;
            bottom: 50px;
            font-size: 28px;
            color: #F3EDE7;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">FOR FUNDERS</div>
        <h1>Invest<br>Smarter</h1>
        <p class="tagline">Access curated dealflow & build your portfolio</p>

        <div class="benefits">
            <div class="benefit-card">
                <div class="benefit-icon">📊</div>
                <div>Curated Dealflow</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">🎤</div>
                <div>Live Pitch Events</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">🤝</div>
                <div>Investor Network</div>
            </div>
            <div class="benefit-card">
                <div class="benefit-icon">📚</div>
                <div>Best Practices</div>
            </div>
        </div>

        <div class="price-section">
            <div class="price">$100/year</div>
            <div class="price-period">or $10/month</div>
        </div>

        <p class="subtext">Join 600+ members building the future</p>

        <div class="logo">SENGO</div>
    </div>
</body>
</html>
