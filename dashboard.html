<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sengo Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F3EDE7;
      color: #1B3533;
      display: flex;
    }
    h1, h2, h3, h4 { font-family: 'Arimo', sans-serif; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    input, textarea, select { font-family: inherit; outline: none; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #1B3533;
      color: #F3EDE7;
      display: flex;
      flex-direction: column;
      padding: 0;
      height: 100vh;
      position: relative;
      z-index: 10;
    }
    .sidebar-logo {
      padding: 28px 24px 20px;
      border-bottom: 1px solid rgba(243,237,231,0.1);
    }
    .sidebar-logo h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .sidebar-logo span {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.6;
      display: block;
      margin-top: 4px;
      font-family: 'Montserrat', sans-serif;
    }
    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-nav-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.4;
      padding: 16px 12px 8px;
      font-weight: 600;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: transparent;
      color: rgba(243,237,231,0.7);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover {
      background: rgba(243,237,231,0.08);
      color: #F3EDE7;
    }
    .nav-item.active {
      background: rgba(213,112,40,0.25);
      color: #F3EDE7;
    }
    .nav-item .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .nav-item .nav-badge {
      margin-left: auto;
      background: #D57028;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      min-width: 22px;
      text-align: center;
    }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(243,237,231,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #D57028;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .sidebar-user-info {
      flex: 1;
    }
    .sidebar-user-info .name {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sidebar-user-info .role {
      font-size: 0.7rem;
      opacity: 0.5;
    }

    /* ========== MAIN CONTENT ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #fff;
      border-bottom: 1px solid rgba(27,53,51,0.08);
      min-height: 64px;
    }
    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F3EDE7;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: rgba(27,53,51,0.5);
    }
    .topbar-search input {
      border: none;
      background: transparent;
      color: #1B3533;
      font-size: 0.85rem;
      width: 180px;
    }
    .topbar-search input::placeholder { color: rgba(27,53,51,0.4); }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    /* ========== PANEL VISIBILITY ========== */
    .panel { display: none; height: 100%; }
    .panel.active { display: flex; flex-direction: column; }

    /* ========== CHAT PANEL ========== */
    #chat-panel {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    #chat-panel.active { display: flex; }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-threads {
      display: flex;
      gap: 8px;
      padding: 0 0 20px;
      border-bottom: 1px solid rgba(27,53,51,0.08);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .chat-thread-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: #fff;
      color: #1B3533;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(27,53,51,0.1);
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chat-thread-btn:hover { border-color: #D57028; }
    .chat-thread-btn.active {
      background: #1B3533;
      color: #F3EDE7;
      border-color: #1B3533;
    }
    .chat-thread-btn.new-thread {
      background: transparent;
      border: 1px dashed rgba(27,53,51,0.25);
      color: rgba(27,53,51,0.5);
    }
    .chat-thread-btn.new-thread:hover {
      border-color: #D57028;
      color: #D57028;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-msg {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: msgIn 0.3s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #1B3533;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #F3EDE7;
      flex-shrink: 0;
    }
    .chat-msg.user .chat-msg-avatar {
      background: #D57028;
    }
    .chat-msg-bubble {
      background: #fff;
      border: 1px solid rgba(27,53,51,0.08);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .chat-msg.user .chat-msg-bubble {
      background: #1B3533;
      color: #F3EDE7;
      border-color: #1B3533;
    }
    .chat-msg-meta {
      font-size: 0.7rem;
      opacity: 0.4;
      margin-top: 6px;
    }
    .chat-msg-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chat-msg-tag.idea { background: rgba(213,112,40,0.15); color: #D57028; }
    .chat-msg-tag.priority { background: rgba(200,40,40,0.12); color: #c82828; }
    .chat-msg-tag.need { background: rgba(40,120,200,0.12); color: #2878c8; }
    .chat-msg-tag.action { background: rgba(40,160,80,0.12); color: #28a050; }

    .chat-input-area {
      border-top: 1px solid rgba(27,53,51,0.08);
      padding: 16px 0 0;
      flex-shrink: 0;
    }
    .chat-tag-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .chat-tag-btn {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(27,53,51,0.06);
      color: rgba(27,53,51,0.5);
      transition: all 0.2s;
    }
    .chat-tag-btn:hover { background: rgba(27,53,51,0.1); color: #1B3533; }
    .chat-tag-btn.active-idea { background: rgba(213,112,40,0.15); color: #D57028; }
    .chat-tag-btn.active-priority { background: rgba(200,40,40,0.12); color: #c82828; }
    .chat-tag-btn.active-need { background: rgba(40,120,200,0.12); color: #2878c8; }
    .chat-tag-btn.active-action { background: rgba(40,160,80,0.12); color: #28a050; }

    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .chat-input-row textarea {
      flex: 1;
      border: 1px solid rgba(27,53,51,0.12);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      line-height: 1.5;
      background: #fff;
      transition: border-color 0.2s;
    }
    .chat-input-row textarea:focus { border-color: #D57028; }
    .chat-send-btn {
      background: #D57028;
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .chat-send-btn:hover { background: #c06020; }

    /* ========== TASKS PANEL ========== */
    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .tasks-tabs {
      display: flex;
      gap: 4px;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid rgba(27,53,51,0.08);
    }
    .tasks-tab {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: transparent;
      color: rgba(27,53,51,0.5);
      transition: all 0.2s;
    }
    .tasks-tab:hover { color: #1B3533; }
    .tasks-tab.active {
      background: #1B3533;
      color: #F3EDE7;
    }
    .tasks-filters {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-select {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(27,53,51,0.12);
      font-size: 0.82rem;
      background: #fff;
      color: #1B3533;
      cursor: pointer;
    }
    .add-task-btn {
      padding: 8px 18px;
      border-radius: 8px;
      background: #D57028;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .add-task-btn:hover { background: #c06020; }

    /* Task columns */
    .tasks-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
      overflow-y: auto;
    }
    .task-column {
      background: rgba(255,255,255,0.5);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .task-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(27,53,51,0.06);
    }
    .task-col-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .task-col-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .task-col-dot.todo { background: #AF8145; }
    .task-col-dot.progress { background: #D57028; }
    .task-col-dot.done { background: #28a050; }
    .task-col-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(27,53,51,0.3);
    }
    .task-col-cards {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      border: 1px solid rgba(27,53,51,0.06);
      cursor: pointer;
      transition: all 0.2s;
    }
    .task-card:hover {
      border-color: rgba(213,112,40,0.3);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(27,53,51,0.06);
    }
    .task-card-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .task-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .task-card-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .task-card-tag.work { background: rgba(27,53,51,0.08); color: #1B3533; }
    .task-card-tag.personal { background: rgba(175,129,69,0.15); color: #AF8145; }
    .task-card-tag.sengo { background: rgba(213,112,40,0.12); color: #D57028; }
    .task-card-tag.other { background: rgba(40,120,200,0.1); color: #2878c8; }
    .task-card-date {
      font-size: 0.72rem;
      color: rgba(27,53,51,0.4);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .task-card-date.overdue { color: #c82828; font-weight: 600; }
    .task-card-actions {
      display: flex;
      gap: 4px;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .task-card:hover .task-card-actions { opacity: 1; }
    .task-action-btn {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(27,53,51,0.05);
      color: rgba(27,53,51,0.5);
      transition: all 0.15s;
    }
    .task-action-btn:hover { background: #D57028; color: #fff; }
    .task-action-btn.delete:hover { background: #c82828; }

    /* ========== ADD TASK MODAL ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27,53,51,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 480px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(27,53,51,0.15);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-field {
      margin-bottom: 16px;
    }
    .modal-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: rgba(27,53,51,0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(27,53,51,0.12);
      border-radius: 8px;
      font-size: 0.88rem;
      background: #FAFAFA;
      transition: border-color 0.2s;
    }
    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus { border-color: #D57028; background: #fff; }
    .modal-field textarea { min-height: 80px; resize: vertical; }
    .modal-row {
      display: flex;
      gap: 12px;
    }
    .modal-row .modal-field { flex: 1; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }
    .modal-cancel {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(27,53,51,0.06);
      color: #1B3533;
    }
    .modal-submit {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #D57028;
      color: #fff;
    }
    .modal-submit:hover { background: #c06020; }

    /* ========== CONTENT PANEL ========== */
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .channel-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid rgba(27,53,51,0.08);
    }
    .channel-tab {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: transparent;
      color: rgba(27,53,51,0.5);
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .channel-tab:hover { color: #1B3533; }
    .channel-tab.active {
      background: #1B3533;
      color: #F3EDE7;
    }
    .add-content-btn {
      padding: 8px 18px;
      border-radius: 8px;
      background: #D57028;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .add-content-btn:hover { background: #c06020; }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .content-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(27,53,51,0.06);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .content-card:hover {
      border-color: rgba(213,112,40,0.3);
      box-shadow: 0 4px 16px rgba(27,53,51,0.06);
    }
    .content-card-channel {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .content-card-channel .ch-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .ch-instagram { background: #E1306C; }
    .ch-linkedin { background: #0077B5; }
    .ch-twitter { background: #1DA1F2; }
    .ch-email { background: #D57028; }
    .ch-blog { background: #28a050; }
    .ch-tiktok { background: #010101; }
    .content-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .content-card-notes {
      font-size: 0.82rem;
      color: rgba(27,53,51,0.5);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .content-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(27,53,51,0.06);
      padding-top: 12px;
    }
    .content-card-date {
      font-size: 0.72rem;
      color: rgba(27,53,51,0.4);
    }
    .content-card-status {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .content-card-status.draft { background: rgba(175,129,69,0.12); color: #AF8145; }
    .content-card-status.scheduled { background: rgba(40,120,200,0.1); color: #2878c8; }
    .content-card-status.published { background: rgba(40,160,80,0.1); color: #28a050; }

    /* ========== CONTENT DETAIL PANEL ========== */
    .content-detail-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27,53,51,0.4);
      z-index: 100;
      justify-content: flex-end;
    }
    .content-detail-overlay.active { display: flex; }
    .content-detail {
      width: 600px;
      max-width: 95vw;
      background: #fff;
      height: 100vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: -10px 0 40px rgba(27,53,51,0.1);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {

<script>
// ==================== STATE MANAGEMENT ====================
const STATE_KEY = 'sengo_dashboard_state';

function getDefaultState() {
  return {
    chat: {
      threads: {
        general: [
          { id: 1, sender: 'system', text: 'Welcome to your Sengo Dashboard. Use this chat to think through ideas, set priorities, and track your needs. Tag messages to keep them organized.', tag: null, time: new Date().toISOString() }
        ],
        ideas: [],
        priorities: [],
        needs: []
      },
      activeThread: 'general'
    },
    tasks: [
      { id: 1, title: 'Finalize Q1 fundraising strategy', desc: 'Review deck, update financial projections', category: 'work', business: 'sengo', type: 'strategy', status: 'todo', date: getFutureDate(3) },
      { id: 2, title: 'Schedule investor update email', desc: 'Monthly update to LP base', category: 'work', business: 'sengo', type: 'outreach', status: 'todo', date: getFutureDate(5) },
      { id: 3, title: 'Review content calendar for Feb', desc: '', category: 'work', business: 'sengo', type: 'marketing', status: 'progress', date: getFutureDate(2) },
      { id: 4, title: 'Personal tax prep documents', desc: 'Gather W2s, 1099s', category: 'personal', business: 'other', type: 'finance', status: 'todo', date: getFutureDate(14) },
      { id: 5, title: 'App onboarding flow improvements', desc: 'Simplify founder enrollment steps', category: 'work', business: 'sengo', type: 'product', status: 'progress', date: getFutureDate(7) },
      { id: 6, title: 'Send partnership proposal to BGV', desc: '', category: 'work', business: 'sengo', type: 'outreach', status: 'done', date: getFutureDate(-2) },
    ],
    content: [
      { id: 1, title: 'Founder Spotlight: Q1 Cohort', notes: 'Highlight 2-3 founders from the latest cohort. Focus on traction, unique value prop, and what support they need from funders.', channel: 'instagram', date: getFutureDate(4), status: 'draft' },
      { id: 2, title: 'Why Private Markets Need More Diversity', notes: 'Stat-driven post about the wealth gap in private assets. Reference the 90+ touchpoints stat and the $5M raised figure.', channel: 'linkedin', date: getFutureDate(6), status: 'scheduled' },
      { id: 3, title: 'Monthly Investor Update', notes: 'Portfolio performance, new founders onboarded, upcoming events. Keep it concise and data-forward.', channel: 'email', date: getFutureDate(8), status: 'draft' },
      { id: 4, title: 'Behind the Scenes: Sengo Events', notes: 'Quick video recap of the latest networking event. Show energy, connections, and real conversations.', channel: 'tiktok', date: getFutureDate(3), status: 'draft' },
      { id: 5, title: 'The Future of Community-Driven Investing', notes: 'Long-form piece on how community-driven models are reshaping venture. Mention Sengo model as case study.', channel: 'blog', date: getFutureDate(12), status: 'draft' },
    ],
    activePanel: 'chat',
    taskView: 'all',
    contentChannel: 'all',
    nextTaskId: 7,
    nextContentId: 6
  };
}

function getFutureDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function loadState() {
  try {
    const saved = localStorage.getItem(STATE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return getDefaultState();
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();

// ==================== NAVIGATION ====================
const navItems = document.querySelectorAll('.nav-item');
const panels = document.querySelectorAll('.panel');
const topbarTitle = document.getElementById('topbar-title');

function switchPanel(panelName) {
  state.activePanel = panelName;
  navItems.forEach(n => n.classList.toggle('active', n.dataset.panel === panelName));
  panels.forEach(p => p.classList.toggle('active', p.id === panelName + '-panel'));
  const titles = { chat: 'Chat', tasks: 'Tasks', content: 'Content' };
  topbarTitle.textContent = titles[panelName] || panelName;
  saveState();
}

navItems.forEach(btn => {
  btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
});

// ==================== CHAT ====================
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatSendBtn = document.getElementById('chat-send');
const chatThreadBtns = document.querySelectorAll('.chat-thread-btn:not(.new-thread)');
const newThreadBtn = document.getElementById('new-thread-btn');
let activeTag = null;

// Tag selector
document.querySelectorAll('.chat-tag-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tag = btn.dataset.tag;
    if (activeTag === tag) {
      activeTag = null;
      btn.className = 'chat-tag-btn';
    } else {
      document.querySelectorAll('.chat-tag-btn').forEach(b => b.className = 'chat-tag-btn');
      activeTag = tag;
      btn.className = 'chat-tag-btn active-' + tag;
    }
  });
});

function renderChat() {
  const thread = state.chat.activeThread;
  const messages = state.chat.threads[thread] || [];

  if (messages.length === 0) {
    chatMessages.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">&#128488;</div>
        <div class="empty-state-text">No messages in this thread yet</div>
        <div class="empty-state-sub">Start typing to capture your thoughts</div>
      </div>`;
    return;
  }

  chatMessages.innerHTML = messages.map(m => {
    const isUser = m.sender === 'user';
    const tagHtml = m.tag ? `<div class="chat-msg-tag ${m.tag}">${m.tag}</div>` : '';
    const timeStr = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="chat-msg ${isUser ? 'user' : ''}">
        <div class="chat-msg-avatar">${isUser ? 'You' : 'S'}</div>
        <div>
          <div class="chat-msg-bubble">${escapeHtml(m.text)}</div>
          <div class="chat-msg-meta">${timeStr}</div>
          ${tagHtml}
        </div>
      </div>`;
  }).join('');

  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  const thread = state.chat.activeThread;
  if (!state.chat.threads[thread]) state.chat.threads[thread] = [];

  state.chat.threads[thread].push({
    id: Date.now(),
    sender: 'user',
    text: text,
    tag: activeTag,
    time: new Date().toISOString()
  });

  chatInput.value = '';
  chatInput.style.height = 'auto';
  saveState();
  renderChat();

  // Auto-response after a moment
  setTimeout(() => {
    const responses = generateSmartResponse(text, activeTag, thread);
    state.chat.threads[thread].push({
      id: Date.now(),
      sender: 'system',
      text: responses,
      tag: null,
      time: new Date().toISOString()
    });
    saveState();
    renderChat();
  }, 600);
}

function generateSmartResponse(text, tag, thread) {
  const lower = text.toLowerCase();

  if (tag === 'idea') {
    const ideaResponses = [
      `That's worth exploring. A few angles to consider:\n\n1. How does this align with current quarterly goals?\n2. What resources or partnerships would this require?\n3. What's the smallest version you could test first?\n\nWant to turn this into a task or content piece?`,
      `Noted. To develop this further, think about:\n\n- Target audience / who benefits most\n- Timeline to prototype or pilot\n- Any existing assets you can leverage\n\nI've logged this in your ideas thread.`,
      `Interesting direction. Consider validating by:\n\n1. Checking if this resonates with your community\n2. Mapping it against current priorities\n3. Identifying quick wins vs. long-term plays`
    ];
    return ideaResponses[Math.floor(Math.random() * ideaResponses.length)];
  }

  if (tag === 'priority') {
    return `Flagged as a priority. Here's how I'd think about sequencing this:\n\n- Urgency: Is there a hard deadline?\n- Impact: Does this unlock other work?\n- Effort: Can you delegate or break it down?\n\nWant me to create a task for this so it's tracked on your board?`;
  }

  if (tag === 'need') {
    return `Understood. To move on this, you'll want to:\n\n1. Define the specific outcome you need\n2. Identify who can help fulfill this\n3. Set a target date for resolution\n\nShould I add this as a task with a due date?`;
  }

  if (tag === 'action') {
    return `Action item captured. I'd recommend:\n\n- Breaking this into clear next steps\n- Assigning it a due date\n- Deciding if it's work or personal\n\nReady to add this to your task board?`;
  }

  if (lower.includes('content') || lower.includes('post') || lower.includes('social')) {
    return `Great thinking on the content front. A few prompts:\n\n- What channel would this perform best on?\n- Can you repurpose this across multiple platforms?\n- What's the core message in one sentence?\n\nHead to the Content tab to start drafting.`;
  }

  if (lower.includes('fund') || lower.includes('invest') || lower.includes('raise')) {
    return `On the fundraising / investment front, key considerations:\n\n- Where are you in the current raise cycle?\n- Who are the warm leads to follow up with?\n- What materials need updating?\n\nI'd suggest creating tasks for each action item.`;
  }

  const defaults = [
    `Good input. A few ways to think about this:\n\n- What's the immediate next step?\n- Does this connect to any existing priorities?\n- Should this become a task or content item?\n\nTag your messages with Idea, Priority, Need, or Action to keep things organized.`,
    `Captured. To make this actionable:\n\n1. Clarify the desired outcome\n2. Identify any blockers\n3. Decide on timing\n\nUse the tags below to categorize your thoughts.`,
    `Thanks for thinking through this. Consider:\n\n- Is this time-sensitive?\n- Who else needs to be involved?\n- What does success look like?\n\nYou can move this to Tasks or Content when you're ready to act on it.`
  ];
  return defaults[Math.floor(Math.random() * defaults.length)];
}

const tasksTabs = document.querySelectorAll('.tasks-tab');
const filterBusiness = document.getElementById('filter-business');
const filterType = document.getElementById('filter-type');

function renderTasks() {
  const view = state.taskView;
  const biz = filterBusiness.value;
  const type = filterType.value;

  let filtered = state.tasks.filter(t => {
    if (view === 'work' && t.category !== 'work') return false;
    if (view === 'personal' && t.category !== 'personal') return false;
    if (biz !== 'all' && t.business !== biz) return false;
    if (type !== 'all' && t.type !== type) return false;
    return true;
  });

  const todo = filtered.filter(t => t.status === 'todo');
  const progress = filtered.filter(t => t.status === 'progress');
  const done = filtered.filter(t => t.status === 'done');

  document.getElementById('todo-count').textContent = todo.length;
  document.getElementById('progress-count').textContent = progress.length;
  document.getElementById('done-count').textContent = done.length;
  document.getElementById('task-count-badge').textContent = state.tasks.filter(t => t.status !== 'done').length;

  renderTaskColumn('todo-cards', todo);
  renderTaskColumn('progress-cards', progress);
  renderTaskColumn('done-cards', done);
}

function renderTaskColumn(containerId, tasks) {
  const container = document.getElementById(containerId);
  if (tasks.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:30px 10px"><div class="empty-state-text" style="font-size:0.8rem">No tasks</div></div>';
    return;
  }
  container.innerHTML = tasks.map(t => {
    const today = new Date().toISOString().split('T')[0];
    const isOverdue = t.date < today && t.status !== 'done';
    const dateClass = isOverdue ? 'overdue' : '';
    const dateDisplay = t.date ? formatDate(t.date) : '';

    let nextStatus = '';
    let nextLabel = '';
    if (t.status === 'todo') { nextStatus = 'progress'; nextLabel = 'Start'; }
    else if (t.status === 'progress') { nextStatus = 'done'; nextLabel = 'Complete'; }
    else { nextStatus = 'todo'; nextLabel = 'Reopen'; }

    return `
      <div class="task-card" data-id="${t.id}">
        <div class="task-card-title">${escapeHtml(t.title)}</div>
        <div class="task-card-meta">
          <span class="task-card-tag ${t.category}">${t.category}</span>
          <span class="task-card-tag ${t.business}">${t.business}</span>
          <span class="task-card-tag" style="background:rgba(27,53,51,0.05);color:rgba(27,53,51,0.5)">${t.type}</span>
          ${dateDisplay ? `<span class="task-card-date ${dateClass}">${dateDisplay}</span>` : ''}
        </div>
        <div class="task-card-actions">
          <button class="task-action-btn" onclick="moveTask(${t.id}, '${nextStatus}')">${nextLabel}</button>
          <button class="task-action-btn" onclick="editTask(${t.id})">Edit</button>
          <button class="task-action-btn delete" onclick="deleteTask(${t.id})">Delete</button>
        </div>
      </div>`;
  }).join('');
}

function moveTask(id, newStatus) {
  const task = state.tasks.find(t => t.id === id);
  if (task) { task.status = newStatus; saveState(); renderTasks(); }
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  renderTasks();
}

function editTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('task-modal-title').textContent = 'Edit Task';
  document.getElementById('task-title-input').value = task.title;
  document.getElementById('task-desc-input').value = task.desc;
  document.getElementById('task-category-input').value = task.category;
  document.getElementById('task-business-input').value = task.business;
  document.getElementById('task-type-input').value = task.type;
  document.getElementById('task-date-input').value = task.date;
  document.getElementById('task-modal').classList.add('active');
  document.getElementById('submit-task').dataset.editId = id;
}

function generateContentSuggestion(action, notes, item) {
  const channel = item.channel;
  const title = item.title;

  const channelTips = {
    instagram: { tone: 'visual, authentic, community-driven', format: 'carousel or single image with caption (2200 char max)', audience: 'founders, aspiring investors, community builders' },
    linkedin: { tone: 'professional, data-driven, thought leadership', format: 'text post (3000 char) or article', audience: 'investors, fund managers, professionals' },
    twitter: { tone: 'concise, punchy, conversational', format: 'thread (280 char per tweet) or single tweet', audience: 'tech community, startup ecosystem' },
    email: { tone: 'direct, personal, value-packed', format: 'newsletter with clear sections and CTA', audience: 'subscribers, investors, founders in network' },
    blog: { tone: 'in-depth, educational, SEO-friendly', format: 'long-form article (800-2000 words)', audience: 'organic search, industry readers' },
    tiktok: { tone: 'casual, energetic, trend-aware', format: 'short video (15-60s) with hook in first 3 seconds', audience: 'younger investors, aspiring founders' }
  };

  const tip = channelTips[channel] || channelTips.instagram;

  if (action === 'interpret') {
    if (!notes) return 'Add some notes first, then I can help interpret and structure them into a content plan.';
    return `<strong>Interpretation of Your Notes:</strong><br><br>` +
      `Based on your notes about "${title}", here's a structured breakdown:<br><br>` +
      `<strong>Core Message:</strong> ${extractCore(notes)}<br><br>` +
      `<strong>Key Points to Hit:</strong><br>` +
      `${extractBullets(notes)}<br><br>` +
      `<strong>Suggested Angle for ${capitalize(channel)}:</strong> Lead with ${tip.tone} approach. Format as ${tip.format}. Your audience here is ${tip.audience}.<br><br>` +
      `<strong>Recommended Hook:</strong> "${generateHook(notes, channel)}"`;
  }

  if (action === 'expand') {
    if (!notes) return 'Write some notes or a rough draft first, and I\'ll expand them into a full post.';
    return `<strong>Expanded Draft for ${capitalize(channel)}:</strong><br><br>` +
      `${expandPost(notes, channel, tip)}`;
  }

  if (action === 'hooks') {
    return `<strong>Hook Options for "${title}":</strong><br><br>` +
      `1. "${generateHook(notes, channel)}"<br><br>` +
      `2. "Most people don't know this about ${getTopicKeyword(notes)}..."<br><br>` +
      `3. "Here's what changed when we focused on ${getTopicKeyword(notes)}"<br><br>` +
      `4. "The biggest myth about ${getTopicKeyword(notes)}? Let's break it down."<br><br>` +
      `5. "${getStatHook(notes)}"<br><br>` +
      `<em>Pick the one that feels most authentic to your voice.</em>`;
  }

  if (action === 'hashtags') {
    const hashtags = generateHashtags(notes, channel);
    return `<strong>Suggested Hashtags:</strong><br><br>` +
      `<strong>Primary (high relevance):</strong><br>${hashtags.primary.join(' ')}<br><br>` +
      `<strong>Discovery (broader reach):</strong><br>${hashtags.discovery.join(' ')}<br><br>` +
      `<strong>Community:</strong><br>${hashtags.community.join(' ')}<br><br>` +
      `<em>Use 5-8 hashtags for optimal reach on ${capitalize(channel)}.</em>`;
  }

  if (action === 'cta') {
    return `<strong>Call-to-Action Options:</strong><br><br>` +
      `<strong>Direct:</strong> "Join 600+ members reshaping private markets. Link in bio."<br><br>` +
      `<strong>Engagement:</strong> "What's your take? Drop your thoughts below."<br><br>` +
      `<strong>Value-first:</strong> "Want to learn more about ${getTopicKeyword(notes)}? We break it all down in our latest guide."<br><br>` +
      `<strong>Community:</strong> "Tag someone who needs to see this."<br><br>` +
      `<strong>Newsletter:</strong> "Get insights like these every week - subscribe to our newsletter."`;
  }

  if (action === 'rewrite') {
    return `<strong>Tone Variations:</strong><br><br>` +
      `<strong>Professional:</strong><br>"${rewriteTone(notes, 'professional')}"<br><br>` +
      `<strong>Conversational:</strong><br>"${rewriteTone(notes, 'conversational')}"<br><br>` +
      `<strong>Bold/Provocative:</strong><br>"${rewriteTone(notes, 'bold')}"<br><br>` +
      `<em>Choose the tone that matches your ${capitalize(channel)} brand voice.</em>`;
  }

  return 'Select a suggestion type to get started.';
}

// Content helper functions
function extractCore(notes) {
  const sentences = notes.split(/[.!?]+/).filter(s => s.trim().length > 10);
  return sentences.length > 0 ? sentences[0].trim() + '.' : 'Your core message needs definition - try writing a one-sentence summary.';
}

function extractBullets(notes) {
  const words = notes.split(/\s+/);
  const phrases = [];
  for (let i = 0; i < words.length; i += Math.ceil(words.length / 3)) {
    const chunk = words.slice(i, i + Math.ceil(words.length / 3)).join(' ');
    if (chunk.trim()) phrases.push('- ' + chunk.trim());
  }
  return phrases.slice(0, 4).join('<br>');
}

function generateHook(notes, channel) {
  const keyword = getTopicKeyword(notes);
  const hooks = {
    instagram: `We need to talk about ${keyword}.`,
    linkedin: `After working in ${keyword} for years, here's what I've learned:`,
    twitter: `Hot take on ${keyword}:`,
    email: `Something important about ${keyword} that most people miss`,
    blog: `The Complete Guide to ${capitalize(keyword)}: What You Need to Know`,
    tiktok: `Wait - did you know this about ${keyword}?`
  };
  return hooks[channel] || hooks.instagram;
}

function getTopicKeyword(notes) {
  const stopWords = new Set(['the','a','an','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','must','shall','can','need','dare','ought','used','to','of','in','for','on','with','at','by','from','as','into','through','during','before','after','above','below','between','out','off','over','under','again','further','then','once','and','but','or','nor','not','so','yet','both','either','neither','each','every','all','any','few','more','most','other','some','such','no','only','own','same','than','too','very','just','about','it','its','this','that','these','those','what','which','who','whom','whose','where','when','why','how']);
  const words = notes.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 3 && !stopWords.has(w));
  const freq = {};
  words.forEach(w => freq[w] = (freq[w] || 0) + 1);
  const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
  return sorted.length > 0 ? sorted[0][0] : 'this topic';
}

function getStatHook(notes) {
  const nums = notes.match(/\d+/g);
  if (nums && nums.length > 0) return `${nums[0]}+ and counting. Here's the story behind the numbers.`;
  return `The numbers don't lie. Here's what the data shows.`;
}

function generateHashtags(notes, channel) {
  return {
    primary: ['#PrivateMarkets', '#WealthGap', '#ImpactInvesting', '#StartupFunding'],
    discovery: ['#Entrepreneurship', '#VentureCapital', '#Innovation', '#FutureOfFinance'],
    community: ['#Sengo', '#BuildWealth', '#FounderLife', '#InvestorCommunity']
  };
}

function expandPost(notes, channel, tip) {
  const core = extractCore(notes);
  const keyword = getTopicKeyword(notes);

  if (channel === 'linkedin' || channel === 'blog') {
    return `${core}<br><br>` +
      `Here's why ${keyword} matters now more than ever:<br><br>` +
      `The private markets landscape is shifting. Traditional gatekeeping is giving way to community-driven models that prioritize access, education, and real relationships.<br><br>` +
      `At Sengo, we've seen this firsthand through 90+ annual touchpoints and a growing community of 600+ members. The data tells a clear story: when you lower barriers and build genuine connections, everyone benefits.<br><br>` +
      `Key takeaways:<br>` +
      `- Access alone isn't enough - education and support matter<br>` +
      `- Community-driven models outperform traditional approaches<br>` +
      `- The wealth gap in private assets won't close itself<br><br>` +
      `<em>Edit this draft to match your voice and add specific examples from your experience.</em>`;
  }

  return `${core}<br><br>` +
    `${notes}<br><br>` +
    `This is just the beginning. More to come on ${keyword}.<br><br>` +
    `<em>Adapt this draft for ${capitalize(channel)}'s ${tip.format} format. Keep the tone ${tip.tone}.</em>`;
}

function rewriteTone(notes, tone) {
  const core = extractCore(notes);
  if (tone === 'professional') return `Our analysis indicates that ${core.toLowerCase()} This trend represents a significant opportunity for forward-thinking investors and founders alike.`;
  if (tone === 'conversational') return `So here's the thing - ${core.toLowerCase()} And honestly? It's about time we talked about it more openly.`;
  if (tone === 'bold') return `Let's be real: ${core.toLowerCase()} If you're not paying attention to this, you're already behind.`;
  return core;
}

// Cross-post functionality
document.getElementById('cross-post-channels').addEventListener('click', (e) => {
  const btn = e.target.closest('.cross-post-btn');
  if (!btn) return;

  btn.classList.toggle('active');
  const selectedChannels = [...document.querySelectorAll('#cross-post-channels .cross-post-btn.active')].map(b => b.dataset.channel);

  const output = document.getElementById('cross-post-output');
  if (selectedChannels.length === 0) {
    output.style.display = 'none';
    return;
  }

  const notes = document.getElementById('detail-notes').value.trim();
  const item = state.content.find(c => c.id === activeDetailId);
  if (!item) return;

  output.style.display = 'block';
  output.classList.add('loading');
  output.textContent = 'Adapting content for selected channels...';

  setTimeout(() => {
    output.classList.remove('loading');
    const adaptations = selectedChannels.map(ch => {
      const labels = { instagram: 'Instagram', linkedin: 'LinkedIn', twitter: 'Twitter/X', email: 'Email', blog: 'Blog', tiktok: 'TikTok' };
      return `<strong>${labels[ch]}:</strong><br>${adaptForChannel(notes, item.channel, ch)}`;
    }).join('<br><br>');

    output.innerHTML = `<strong>Cross-Channel Adaptations:</strong><br><br>${adaptations}<br><br><em>Click "Save Changes" and create new content items for each channel you want to publish to.</em>`;
  }, 600);
});

function adaptForChannel(notes, fromChannel, toChannel) {
  const core = extractCore(notes);
  const adapts = {
    instagram: `Visual-first approach: Create a carousel with the key points. Caption: "${core}" Keep it authentic and use relevant hashtags. Consider a Reel for more engagement.`,
    linkedin: `Professional angle: Expand into a thought leadership post. Lead with data and insights. "${core}" Add your professional perspective and invite discussion.`,
    twitter: `Thread format: Break into 3-5 tweets. Tweet 1 (hook): "${core}" Follow with supporting points and end with a CTA. Keep each tweet punchy.`,
    email: `Newsletter segment: Use as a featured section. Subject line based on "${core}" Include a clear CTA and link back to your full content.`,
    blog: `Long-form: Expand into a 800-1500 word article. Use "${core}" as the thesis. Add research, examples, and actionable takeaways. Optimize for SEO.`,
    tiktok: `Short video: 30-60 second take on this topic. Hook in first 3 seconds with "${core}" Use trending audio if applicable. Keep it conversational and direct-to-camera.`
  };
  return adapts[toChannel] || 'Adapt the core message for this platform\'s format and audience.';
}

// ==================== SEARCH ====================
document.getElementById('global-search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (!query) {
    if (state.activePanel === 'tasks') renderTasks();
    if (state.activePanel === 'content') renderContent();
    return;
  }

  if (state.activePanel === 'tasks') {
    const original = [...state.tasks];
    state.tasks = original.filter(t =>
      t.title.toLowerCase().includes(query) ||
      t.desc.toLowerCase().includes(query) ||
      t.type.toLowerCase().includes(query)
    );
    renderTasks();
    state.tasks = original;
  }

  if (state.activePanel === 'content') {
    const original = [...state.content];
    state.content = original.filter(c =>
      c.title.toLowerCase().includes(query) ||
      c.notes.toLowerCase().includes(query) ||
      c.channel.toLowerCase().includes(query)
    );
    renderContent();
    state.content = original;
  }
});

// ==================== UTILITIES ====================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate();
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}
