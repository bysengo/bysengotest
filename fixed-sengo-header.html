<!-- Sengo Custom Header - Standalone Component -->
<!-- Copy this entire block and paste into any page where you want the header -->

<style>
  /* Google Fonts */
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

  /* Reset for header only */
  .sengo-header * {
    box-sizing: border-box;
  }

  /* Header Navigation */
  .sengo-header {
    background: #1B3533;
    padding: 15px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(27, 53, 51, 0.2);
    width: 100%;
  }

  .sengo-header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    flex-wrap: wrap;
  }

  .sengo-nav-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .sengo-nav-right {
    margin-left: auto;
  }

  .sengo-mobile-login {
    display: none;
  }

  .sengo-logo {
    display: block;
    transition: all 0.3s ease;
  }

  .sengo-logo .sengo-nav-button {
    margin: 0;
  }

  .sengo-nav-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 15px 45px;
    align-items: center;
    justify-content: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* Force line break before Funders (5th item) */
  .sengo-nav-menu li:nth-child(5)::before {
    content: '';
    flex-basis: 100%;
    height: 0;
    order: -1;
  }

  .sengo-nav-link {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    font-weight: 400;
    color: #F3EDE7;
    text-decoration: none;
    letter-spacing: 0.3px;
    transition: all 0.3s ease;
    position: relative;
  }

  .sengo-nav-link:hover {
    color: #D57028 !important;
    text-shadow: 0 0 30px rgba(213, 112, 40, 1),
                 0 0 50px rgba(213, 112, 40, 0.8),
                 0 0 70px rgba(213, 112, 40, 0.6);
    transform: translateY(-15px);
  }

  .sengo-nav-menu li:nth-child(4) .sengo-nav-link,
  .sengo-nav-menu li:nth-child(5) .sengo-nav-link,
  .sengo-nav-menu li:nth-child(6) .sengo-nav-link {
    color: #D57028;
  }

  .sengo-nav-button {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: #F3EDE7;
    background: #D57028;
    padding: 10px 24px;
    border-radius: 30px;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    border: 2px solid #D57028;
  }

  .sengo-nav-button:hover {
    background: transparent;
    border-color: #D57028;
    color: #D57028 !important;
    box-shadow: 0 0 30px rgba(213, 112, 40, 1),
                0 0 50px rgba(213, 112, 40, 0.8),
                0 0 70px rgba(213, 112, 40, 0.6);
    transform: translateY(-15px);
  }

  /* Mobile Menu Toggle */
  .sengo-mobile-toggle {
    display: none;
    background: transparent;
    border: none;
    color: #F3EDE7;
    font-size: 1.8rem;
    cursor: pointer;
    padding: 10px 15px;
    line-height: 1;
    z-index: 1001;
    position: relative;
    pointer-events: auto;
    -webkit-tap-highlight-color: rgba(213, 112, 40, 0.3);
  }

  .sengo-mobile-toggle:hover,
  .sengo-mobile-toggle:focus {
    color: #D57028;
    outline: none;
  }

  .sengo-mobile-toggle:active {
    color: #D57028;
    transform: scale(0.95);
  }

  /* Responsive Design */
  @media (max-width: 768px) {
    .sengo-header {
      position: relative;
    }

    .sengo-header-container {
      padding: 0 20px;
      justify-content: space-between;
      overflow: visible;
    }

    .sengo-logo {
      order: 1;
      z-index: 1001;
    }

    .sengo-mobile-toggle {
      display: block;
      order: 0;
    }

    .sengo-nav-center {
      position: static;
      transform: none;
      order: 3;
      width: 100%;
    }

    .sengo-nav-right {
      display: none;
    }

    .sengo-mobile-login {
      display: block;
    }

    .sengo-nav-menu {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      background: #1B3533;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 999;
      max-height: calc(100vh - 60px);
      overflow-y: auto;
    }

    .sengo-nav-menu.active {
      display: flex !important;
    }

    .sengo-nav-menu li {
      width: 100%;
    }

    .sengo-nav-menu li:nth-child(5)::before {
      display: none;
    }

    .sengo-nav-link {
      display: block;
      padding: 12px 0;
      text-align: center;
      font-size: 1rem;
    }

    .sengo-nav-link:hover {
      transform: translateY(0);
      text-shadow: none;
    }

    .sengo-nav-button {
      width: 100%;
      text-align: center;
      display: block;
      padding: 12px 24px;
    }

    .sengo-nav-button:hover {
      transform: translateY(0);
    }
  }
</style>

<!-- Header HTML -->
<header class="sengo-header">
  <div class="sengo-header-container">
    <!-- Login Button (Left) -->
    <div class="sengo-logo">
      <a href="/login" class="sengo-nav-button">Login</a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="sengo-mobile-toggle" id="sengoMobileToggle" aria-label="Toggle menu" aria-expanded="false" onclick="window.toggleSengoMenu && window.toggleSengoMenu()">
      ☰
    </button>

    <!-- Centered Navigation Menu -->
    <nav class="sengo-nav-center">
      <ul class="sengo-nav-menu" id="sengoNavMenu">
        <li><a href="https://www.bysengo.com/home" class="sengo-nav-link">Home</a></li>
        <li><a href="https://www.bysengo.com/grant" class="sengo-nav-link">Grants</a></li>
        <li><a href="https://www.bysengo.com/pitch" class="sengo-nav-link">Pitch</a></li>
        <li><a href="https://app.bysengo.com/founder-enrollment" class="sengo-nav-link">Founders</a></li>
        <li><a href="https://app.bysengo.com/investor-enrollment" class="sengo-nav-link">Funders</a></li>
        <li><a href="https://app.bysengo.com/allaccess-enrollment" class="sengo-nav-link">All Access</a></li>
        <li class="sengo-mobile-login"><a href="/login" class="sengo-nav-button">Login</a></li>
      </ul>
    </nav>

    <!-- Right Side (Empty) -->
    <div class="sengo-nav-right">
    </div>
  </div>
</header>

<script>
// Sengo Header Mobile Menu Script
(function() {
  'use strict';

  console.log('Sengo header script loaded');

  // Mobile menu toggle function
  function toggleSengoMenu() {
    var navMenu = document.getElementById('sengoNavMenu');
    var menuToggle = document.getElementById('sengoMobileToggle');

    if (!navMenu || !menuToggle) {
      console.error('Sengo: Menu elements not found');
      return;
    }

    var isActive = navMenu.classList.contains('active');
    console.log('Sengo: Toggling menu. Currently active:', isActive);

    if (isActive) {
      navMenu.classList.remove('active');
      menuToggle.setAttribute('aria-expanded', 'false');
      console.log('Sengo: Menu closed');
    } else {
      navMenu.classList.add('active');
      menuToggle.setAttribute('aria-expanded', 'true');
      console.log('Sengo: Menu opened');
    }
  }

  // Make function globally accessible as fallback
  window.toggleSengoMenu = toggleSengoMenu;

  // Initialize function
  function initializeSengoHeader() {
    console.log('Sengo: Initializing header');

    var navMenu = document.getElementById('sengoNavMenu');
    var menuToggle = document.getElementById('sengoMobileToggle');

    if (!navMenu || !menuToggle) {
      console.error('Sengo: Cannot find menu elements on init');
      return;
    }

    console.log('Sengo: Menu elements found, attaching listeners');

    // Add click event to toggle button (with both click and touchstart for mobile)
    menuToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      console.log('Sengo: Toggle button clicked');
      toggleSengoMenu();
    }, false);

    // Also handle touch events for better mobile support
    menuToggle.addEventListener('touchstart', function(e) {
      e.preventDefault();
      e.stopPropagation();
      console.log('Sengo: Toggle button touched');
      toggleSengoMenu();
    }, { passive: false });

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
      if (!navMenu.contains(event.target) && !menuToggle.contains(event.target)) {
        if (navMenu.classList.contains('active')) {
          navMenu.classList.remove('active');
          menuToggle.setAttribute('aria-expanded', 'false');
          console.log('Sengo: Menu closed (clicked outside)');
        }
      }
    });

    // Close mobile menu when clicking a link
    var navLinks = navMenu.querySelectorAll('.sengo-nav-link, .sengo-nav-button');
    navLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        if (navMenu.classList.contains('active')) {
          navMenu.classList.remove('active');
          menuToggle.setAttribute('aria-expanded', 'false');
          console.log('Sengo: Menu closed (link clicked)');
        }
      });
    });

    // Prevent menu from closing when clicking inside it
    navMenu.addEventListener('click', function(e) {
      e.stopPropagation();
    });

    console.log('Sengo: Header initialized successfully');
  }

  // Try multiple initialization methods
  function tryInit() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeSengoHeader);
    } else {
      initializeSengoHeader();
    }

    // Fallback: try again after a short delay
    setTimeout(function() {
      if (!document.getElementById('sengoNavMenu')) {
        console.log('Sengo: Trying delayed init');
        initializeSengoHeader();
      }
    }, 100);
  }

  tryInit();
})();
</script>
