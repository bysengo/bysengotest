<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <title>Founder Membership - Social Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Arimo:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FAF7F4;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(135deg, #D57028 0%, #AF8145 100%);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%);
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px;
            position: relative;
            z-index: 1;
        }

        .badge {
            background: #1B3533;
            color: #F3EDE7;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Arimo', sans-serif;
            font-size: 100px;
            font-weight: 800;
            color: #F3EDE7;
            line-height: 1;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .tagline {
            font-size: 34px;
            color: #F3EDE7;
            font-weight: 600;
            margin-bottom: 80px;
            max-width: 700px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .benefits {
            background: #FFFFFF;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 50px;
            width: 100%;
            max-width: 800px;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 2px solid #F3EDE7;
            color: #1B3533;
            font-size: 24px;
            font-weight: 600;
            text-align: left;
        }

        .benefit-item:last-child {
            border-bottom: none;
        }

        .benefit-item::before {
            content: '✓';
            color: #D57028;
            font-size: 32px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .price-section {
            background: linear-gradient(135deg, #1B3533, #67441A);
            padding: 40px 60px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .price {
            font-size: 68px;
            font-weight: 900;
            color: #D57028;
            margin-bottom: 8px;
        }

        .price-period {
            font-size: 26px;
            color: #F3EDE7;
            font-weight: 600;
        }

        .logo {
            position: absolute;
            bottom: 50px;
            font-size: 28px;
            color: #1B3533;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">FOR FOUNDERS</div>
        <h1>Build<br>Better</h1>
        <p class="tagline">Master fundraising & grow your startup</p>

        <div class="benefits">
            <div class="benefit-item">Fundability education & tools</div>
            <div class="benefit-item">Submit to investor dealflow</div>
            <div class="benefit-item">Monthly founder meet-ups</div>
            <div class="benefit-item">Access to grants & resources</div>
        </div>

        <div class="price-section">
            <div class="price">$160/year</div>
            <div class="price-period">or $15/month</div>
        </div>

        <div class="logo">SENGO</div>
    </div>
</body>
</html>
